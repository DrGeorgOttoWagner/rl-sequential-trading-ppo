<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">Trade frequency per decision</title><desc id="desc">Grouped bars of transaction legs per decision step on VALIDATION and TEST.</desc><rect x="0" y="0" width="1120" height="640" fill="#121923" rx="0"/><text x="52" y="55" fill="#e8edf3" font-size="27" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="700">Trading frequency per daily decision</text><text x="52" y="91" fill="#b7c3cf" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="400">A purchase or sale is one trade. Normalised because VALIDATION and TEST have different lengths.</text><text x="52" y="145" fill="#e8edf3" font-size="19" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="700">VALIDATION</text><text x="100" y="183" fill="#8fb6ff" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="700">E1</text><rect x="370" y="165" width="500.5" height="23" fill="#8fb6ff" rx="3"/><text x="882.5" y="183" fill="#8fb6ff" font-size="16" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="400">0.455</text><text x="100" y="228" fill="#65dab0" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="700">E2</text><rect x="370" y="210" width="233.2" height="23" fill="#65dab0" rx="3"/><text x="615.2" y="228" fill="#65dab0" font-size="16" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="400">0.212</text><text x="100" y="273" fill="#d697e8" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="700">E3</text><rect x="370" y="255" width="522.5" height="23" fill="#d697e8" rx="3"/><text x="904.5" y="273" fill="#d697e8" font-size="16" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="400">0.475</text><text x="100" y="318" fill="#ffbd70" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="700">E4</text><rect x="370" y="300" width="234.29999999999998" height="23" fill="#ffbd70" rx="3"/><text x="616.3" y="318" fill="#ffbd70" font-size="16" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="400">0.213</text><text x="52" y="365" fill="#e8edf3" font-size="19" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="700">TEST</text><text x="100" y="403" fill="#8fb6ff" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="700">E1</text><rect x="370" y="385" width="431.2" height="23" fill="#8fb6ff" rx="3"/><text x="813.2" y="403" fill="#8fb6ff" font-size="16" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="400">0.392</text><text x="100" y="448" fill="#65dab0" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="700">E2</text><rect x="370" y="430" width="113.3" height="23" fill="#65dab0" rx="3"/><text x="495.3" y="448" fill="#65dab0" font-size="16" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="400">0.103</text><text x="100" y="493" fill="#d697e8" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="700">E3</text><rect x="370" y="475" width="404.8" height="23" fill="#d697e8" rx="3"/><text x="786.8" y="493" fill="#d697e8" font-size="16" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="400">0.368</text><text x="100" y="538" fill="#ffbd70" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="700">E4</text><rect x="370" y="520" width="122.10000000000001" height="23" fill="#ffbd70" rx="3"/><text x="504.1" y="538" fill="#ffbd70" font-size="16" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="400">0.111</text><text x="52" y="605" fill="#b7c3cf" font-size="16" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="400">Extended observation O2 (E2, E4) traded less often under both reward designs in both periods.</text></svg>
