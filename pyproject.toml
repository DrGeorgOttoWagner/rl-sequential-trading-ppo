[project]
name = "btc-usdt-rl-trading"
version = "1.0.0"
description = "deterministic data/accounting foundation for the BTC/USDT RL research study (research use only)."
license = { file = "LICENSE-CODE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "stable-baselines3>=2.3",  # PPO agent (frozen study design (docs/methodology.md))
    "torch>=2.2",              # SB3 backend; CPU-only wheels (see [tool.uv] below)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

# PPO on a small MLP needs no GPU (task: CPU unless technically justified).
# torch is therefore resolved from the PyTorch CPU wheel index, which keeps the locked
# closure free of CUDA runtime packages and keeps `uv sync --frozen` small and reproducible.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling==1.32.0"]  # exact pin: no unconstrained build backend
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btc_rl"]
